<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>DEBUG</title>

    <style>
        html, body {
            background-color:#151D21;
            color:#fff;
            text-align:center;
            font-family: 'Open Sans';
        }

        .section1 {
            font-family: 'Open Sans Black';
            font-size: 48px;
        }

        .section2 {
            font-family: 'Open Sans';
            font-size: 48px;
        }

        .section3{
            font-family: 'Open Sans Thin';
            font-size: 48px;
        }

        button.default{
            border: none;
            outline: none;
            background: #fff;
            height: 36px;
            padding-left: 16px;
            padding-right: 16px;
            border-radius: 8px;
            color:#151D21;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.4px;
            cursor: pointer;
        }

        button.round{
            margin:48px;
            border: none;
            outline: none;
            background: #fff;
            height: 36px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="font-contain">
        <h1 class="section1">Header font</h1>
        <h1 class="section2">Normal font</h1>
        <h1 class="section3">Thin font</h1>
    </div>
    <button class="default">Button</button>
    </br>
    <button class="round">Button</button>
</body>
</html>
